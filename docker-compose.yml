services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD: minerva
      POSTGRES_DB: minerva_agent
    ports:
      - '5432:5432'
    volumes:
      - minerva_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minerva -d minerva_agent']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://minerva:minerva@postgres:5432/minerva_agent
      PORT: '3001'
      # Production validation requires GATEWAY_API_KEY + OPENAI_API_KEY + STEEL_API_KEY in .env
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minerva_pg:
